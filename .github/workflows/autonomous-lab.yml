name: Autonomous Engineering Lab

on:
  schedule:
    - cron: "53 6 * * 3"
    - cron: "43 7 1 * *"
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: autonomous-lab-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repo-medic:
    if: github.event_name != 'pull_request_target' && github.event.schedule != '43 7 1 * *'
    permissions:
      contents: read
    uses: asp53826/portfolio-ops/.github/workflows/repo-medic.yml@v1.2.0
    with:
      runtime: cpp
      runtime-version: "system"
      test-command: >-
        make test
      verification-command: >-
        make drat-trim && make proof-test PROOF_COUNT=40

  claim-auditor:
    if: github.event_name != 'pull_request_target' && github.event.schedule != '43 7 1 * *'
    permissions:
      contents: read
      issues: write
    uses: asp53826/portfolio-ops/.github/workflows/claim-auditor.yml@7a0d4bf3b17973f9cdad397f0a66740f16737e18
    with:
      runtime: cpp
      install-command: >-
        make drat-trim

  documentation-scribe:
    if: github.event_name != 'pull_request_target' && github.event.schedule != '43 7 1 * *'
    permissions:
      contents: read
      issues: write
    uses: asp53826/portfolio-ops/.github/workflows/documentation-scribe.yml@v1.0.0

  benchmark-keeper:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 7 1 * *'
    permissions:
      contents: read
    uses: asp53826/portfolio-ops/.github/workflows/benchmark-keeper.yml@v1.2.0
    with:
      runtime: cpp
      runtime-version: "system"
      preflight-command: >-
        make test
      benchmark-command: >-
        python3 bench/ablation.py --instances 6 --vars 120 --timeout 30 && python3 bench/benchmark.py --quick --timeout 30

  dependency-caretaker:
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
    uses: asp53826/portfolio-ops/.github/workflows/dependency-caretaker.yml@v1.1.0

  dependency-merger:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
    uses: asp53826/portfolio-ops/.github/workflows/dependency-merger.yml@v1.1.0
