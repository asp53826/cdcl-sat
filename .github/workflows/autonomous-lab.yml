name: Autonomous Engineering Lab

on:
  schedule:
    - cron: "53 6 * * 3"
    - cron: "43 7 1 * *"
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: autonomous-lab-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repo-medic:
    if: github.event_name != 'pull_request_target' && github.event.schedule != '43 7 1 * *'
    permissions:
      contents: read
    uses: asp53826/portfolio-ops/.github/workflows/repo-medic.yml@v1.0.0
    with:
      runtime: cpp
      runtime-version: "system"
      test-command: >-
        make test
      verification-command: >-
        make drat-trim && make proof-test PROOF_COUNT=40

  documentation-scribe:
    if: github.event_name != 'pull_request_target' && github.event.schedule != '43 7 1 * *'
    permissions:
      contents: read
      issues: write
    uses: asp53826/portfolio-ops/.github/workflows/documentation-scribe.yml@v1.0.0

  benchmark-keeper:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 7 1 * *'
    permissions:
      contents: read
    uses: asp53826/portfolio-ops/.github/workflows/benchmark-keeper.yml@v1.0.0
    with:
      runtime: cpp
      runtime-version: "system"
      preflight-command: >-
        make test
      benchmark-command: >-
        python3 bench/ablation.py --instances 6 --vars 120 --timeout 30 && python3 bench/benchmark.py --quick --timeout 30

  dependency-caretaker:
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: asp53826/portfolio-ops/.github/workflows/dependency-caretaker.yml@v1.0.0

