# The ablation conflict counts are deterministic: same seeded instances, same
# search. They reproduce exactly across compilers and machines, which makes them
# the sharpest regression detector in the repository -- any change to
# propagation, analysis or branching moves them.

[[claim]]
id = "ablation-full-conflicts"
statement = "| full | 381,410 | 3.07 | 1.00x |"
command = "make all && python3 bench/ablation.py --solver ./build/satsolve --instances 25 --vars 200"
pattern = "full\\s+25/25\\s+([0-9,]+)"
expected = 381410
tolerance = 0

[[claim]]
id = "ablation-vsids-decay-is-the-load-bearing-component"
statement = "| no VSIDS decay (`--var-decay 1.0`) | 799,322 | 5.94 | **1.94x** |"
command = "make all && python3 bench/ablation.py --solver ./build/satsolve --instances 25 --vars 200"
pattern = "no VSIDS decay \\(var-decay 1\\.0\\)\\s+25/25\\s+([0-9,]+)"
expected = 799322
tolerance = 0

[[claim]]
id = "restarting-never-is-indistinguishable-from-luby"
statement = "indistinguishable* from Luby restarts at this instance size — 379,551 conflicts against 381,410."
command = "make all && python3 bench/ablation.py --solver ./build/satsolve --instances 25 --vars 200"
pattern = "restart every 50000 conflicts\\s+25/25\\s+([0-9,]+)"
expected = 379551
tolerance = 0

[[claim]]
id = "clause-minimization-is-worth-twenty-percent"
statement = "| no clause minimization | 453,771 | 3.70 | 1.20x |"
command = "make all && python3 bench/ablation.py --solver ./build/satsolve --instances 25 --vars 200"
pattern = "no clause minimization\\s+25/25\\s+([0-9,]+)"
expected = 453771
tolerance = 0

[[claim]]
id = "phase-saving-is-worth-twenty-percent"
statement = "| no phase saving | 403,780 | 3.73 | 1.22x |"
command = "make all && python3 bench/ablation.py --solver ./build/satsolve --instances 25 --vars 200"
pattern = "no phase saving\\s+25/25\\s+([0-9,]+)"
expected = 403780
tolerance = 0

[[claim]]
id = "restarting-too-often-hurts"
statement = "| restart every 20 conflicts | 497,379 | 4.45 | 1.45x |"
command = "make all && python3 bench/ablation.py --solver ./build/satsolve --instances 25 --vars 200"
pattern = "restart every 20 conflicts\\s+25/25\\s+([0-9,]+)"
expected = 497379
tolerance = 0
