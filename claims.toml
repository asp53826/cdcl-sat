# Claims this repository publishes, re-checked by Claim Auditor.
#
# Every entry binds a sentence in the README to the command that produces its
# number. If the sentence is edited away, or the number stops reproducing, the
# audit fails and opens one tracked issue.
#
# The verification campaign is audited at the parameters that produced the
# published table -- 300 instances at 120 variables. Bare `make proof-test`
# uses 60 instances at 90 variables and prints different, equally correct
# numbers; the count and the variable count are both part of the claim.
#
# Scope note: the timing columns are not audited. "seconds" in the ablation and
# every column of the CaDiCaL comparison are wall-clock on an Apple M2 Pro; the
# same ablation on a shared runner takes 4.51s where the README records 3.07s.
# Conflict counts are audited instead, and they are the better metric anyway --
# the README already says conflicts is the search-quality metric and seconds is
# the throughput metric, reported separately for exactly this reason. The
# CaDiCaL rows additionally need a solver that is not fetched by the build.

[[claim]]
id = "all-instances-decided"
statement = "| Random 3-SAT instances solved, ratio 3.6–5.2 | **300** |"
command = "make proof-test PROOF_COUNT=300 PROOF_VARS=120"
pattern = "neither\\s+([0-9]+)"
expected = 0
tolerance = 0

